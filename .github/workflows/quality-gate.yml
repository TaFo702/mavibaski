name: Production Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Production Engineering Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Prepare production server for browser checks
        run: |
          npm run build
          NODE_ENV=production node dist/server.cjs > /tmp/mavibaski-quality-server.log 2>&1 &
          echo $! > /tmp/mavibaski-quality-server.pid
          node --input-type=module <<'NODE'
          const baseURL = process.env.TEST_BASE_URL || 'http://127.0.0.1:3000';
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(baseURL, { signal: AbortSignal.timeout(1000) });
              if (response.status === 200 && (await response.text()).includes('id="root"')) process.exit(0);
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          throw new Error('Production server did not become ready for browser checks.');
          NODE

      - name: Run Full Quality Gate
        run: |
          set -o pipefail
          {
            npm run quality
            npm run validate:head-registry
            npm run validate:prerender-cleanup
            npm run validate:seo-navigation
            npm run validate:invalid
            npm run validate:technical
            npm run validate:site-browser
            npm run validate:seo
          } 2>&1 | tee /tmp/mavibaski-quality-gate.log

      - name: Report quality failure details
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          log = Path('/tmp/mavibaski-quality-gate.log')
          if log.exists():
              detail = '\n'.join(log.read_text(errors='replace').splitlines()[-60:])[-10000:]
              message = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Quality gate failure details::{message}')
          PYTHON

      - name: Verify Vercel production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIVE_BASE_URL: https://mavibasim.com
        run: |
          npm run validate:live-release
          TEST_BASE_URL=https://mavibasim.com npm run validate:technical
          echo "## Live browser checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Desktop/mobile order flow, menu text, removed download buttons and six e-commerce images passed on mavibasim.com. No order or WhatsApp message was sent." >> "$GITHUB_STEP_SUMMARY"

      - name: Stop test server
        if: always()
        run: |
          if [ -f /tmp/mavibaski-quality-server.pid ]; then
            kill "$(cat /tmp/mavibaski-quality-server.pid)" 2>/dev/null || true
          fi

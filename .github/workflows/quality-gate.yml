name: Production Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Production Engineering Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Full Quality Gate
        run: npm run quality

      - name: Verify para makbuzu hydration, pricing preservation and order flow
        run: node validate-para-fix.cjs

      - name: Verify brochure hydration, schema ownership and protected filters
        run: node validate-brosur-hydration.cjs

name: Production Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Production Engineering Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for required browser checks
        timeout-minutes: 10
        run: node node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Run Full Quality Gate
        run: npm run quality

      - name: Verify para makbuzu hydration, pricing preservation and order flow
        run: node validate-para-fix.cjs

      - name: Verify brochure hydration, schema ownership and protected filters
        run: node validate-brosur-hydration.cjs

      - name: Verify el ilani hydration, protected tariff and schema ownership
        run: node validate-el-ilani-fix.cjs

      - name: Verify afis hydration, protected tariff and schema ownership
        run: node validate-afis-fix.cjs

      - name: Verify perakende menus, hydration, protected pricing and WhatsApp quote
        run: node validate-perakende-fix.cjs

      - name: Verify first HTML and hydration for audited pages, featured prices and business hours
        run: node validate-site-audit-fix.cjs
